[package]
name = "hxn-gpu-webgpu"
version = "0.1.0"
edition = "2024"
description = "WebGPU for Haxe in the browser, on hxcpp and Ash compiled to wasm: devices, buffers, textures, bind groups, pipelines and command encoders"
repository = "https://github.com/hx-n/hxn-gpu-webgpu"
license = "Apache-2.0"
keywords = ["webgpu", "gpu", "haxe", "graphics", "compute", "wgsl", "wasm", "emscripten", "browser"]

[lib]
name = "hxn_gpu_webgpu"

[package.metadata.hxn]
# The native libraries are wasm builds, one for hxcpp and one for Ash.
library = "gpu_webgpu"
haxelib = "hxn-gpu-webgpu"
contributors = ["darmie", "rayzor"]
releasenote = "First release."
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
init = ["gpu.webgpu.Shaders.register()"]
# Emscripten's WebGPU: webgpu.h implemented on the page's navigator.gpu.
link-args = { wasm32-unknown-emscripten = ["--use-port=emdawnwebgpu"] }

[dependencies]
# hxn after 0.3.3: threaded Ash side modules, page files and Ash pages.
hxn = { git = "https://github.com/hx-n/hxn.git", rev = "cbf7e13" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", rev = "cbf7e13" }
