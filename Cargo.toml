[package]
name = "hxn-gpu-webgpu"
version = "0.3.0"
edition = "2024"
description = "WebGPU for Haxe in the browser, on hxcpp and Ash compiled to wasm: devices, buffers, textures, bind groups, pipelines and command encoders"
repository = "https://github.com/hx-n/hxn-gpu-webgpu"
license = "Apache-2.0"
keywords = ["webgpu", "gpu", "haxe", "graphics", "compute", "wgsl", "wasm", "emscripten", "browser"]

[lib]
name = "hxn_gpu_webgpu"

[package.metadata.hxn]
# The native libraries are wasm builds, one for hxcpp and one for Ash.
library = "gpu_webgpu"
haxelib = "hxn-gpu-webgpu"
contributors = ["darmie", "rayzor"]
releasenote = "Instance.claimCanvas: under Ash the browser agent takes the web page's canvas when the program claims it, not when it starts, so the page can carry other browser agents, such as WebGL2's."
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
init = ["hxn.gpu.webgpu.Shaders.register()"]

# Emscripten's WebGPU: webgpu.h implemented on the page's navigator.gpu. A
# threaded build runs main on a pthread, which the web page's canvas is
# transferred to.
[package.metadata.hxn.link-args]
wasm32-unknown-emscripten = ["--use-port=emdawnwebgpu"]
wasm32-unknown-emscripten-threads = ["-sOFFSCREENCANVAS_SUPPORT"]

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.5" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.5" }
