[package]
name = "hxn-gpu-webgpu"
version = "0.3.4"
edition = "2024"
description = "WebGPU for Haxe in the browser, on hxcpp and Ash compiled to wasm: devices, buffers, textures, bind groups, pipelines and command encoders"
repository = "https://github.com/hx-n/hxn-gpu-webgpu"
license = "Apache-2.0"
keywords = ["webgpu", "gpu", "haxe", "graphics", "compute", "wgsl", "wasm", "emscripten", "browser", "hxcpp", "hashlink", "native", "cross"]

[lib]
name = "hxn_gpu_webgpu"

[package.metadata.hxn]
# The native libraries are wasm builds, one for hxcpp and one for Ash.
library = "gpu_webgpu"
haxelib = "hxn-gpu-webgpu"
contributors = ["darmie", "rayzor"]
releasenote = "Use hxn 0.3.9 shared logging with application-owned filtering and sinks; retain pinned dependency redistribution notices."
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
init = ["hxn.gpu.webgpu.Shaders.register()"]

# Emscripten's WebGPU: webgpu.h implemented on the page's navigator.gpu. A
# threaded build uses the browser agent instead, which takes the canvas when
# the program claims it.
[package.metadata.hxn.link-args]
wasm32-unknown-emscripten = ["--use-port=emdawnwebgpu"]

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.9" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.9" }

[build-dependencies]
cc = "1"
