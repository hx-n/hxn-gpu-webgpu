[package]
name = "hxn-gpu-webgpu"
version = "0.1.0"
edition = "2024"
description = "WebGPU for Haxe in the browser, through hxcpp and Emscripten: devices, buffers, textures, bind groups, pipelines and command encoders"
repository = "https://github.com/hx-n/hxn-gpu-webgpu"
license = "Apache-2.0"
keywords = ["webgpu", "gpu", "haxe", "graphics", "compute", "wgsl", "wasm", "emscripten", "browser"]

[lib]
name = "hxn_gpu_webgpu"

[package.metadata.hxn]
# The native library is `libgpu_webgpu_cpp.a`, for hxcpp through Emscripten.
library = "gpu_webgpu"
haxelib = "hxn-gpu-webgpu"
contributors = ["darmie", "rayzor"]
releasenote = "First release."
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
init = ["gpu.webgpu.Shaders.register()"]
# Emscripten's WebGPU: webgpu.h implemented on the page's navigator.gpu.
link-args = { wasm32-unknown-emscripten = ["--use-port=emdawnwebgpu"] }

[dependencies]
# hxn after 0.3.2: futures delivered from the page's event loop, and link-args.
hxn = { git = "https://github.com/hx-n/hxn.git", rev = "2a0dc7c" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", rev = "2a0dc7c" }
