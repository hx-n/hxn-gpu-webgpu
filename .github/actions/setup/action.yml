name: setup
description: Rust for Emscripten and Ash's threaded wasm, Haxe, hxcpp, the Emscripten SDK, Ash, hxnsl, and the hxn command at the release Cargo.toml pins.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-25
        targets: wasm32-unknown-emscripten, wasm32-wasip1-threads
        # The Ash build rebuilds the standard library with wasm exceptions.
        components: rust-src
    - uses: Swatinem/rust-cache@v2
    - if: runner.os == 'Linux'
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.6
    # setup-haxe has no Haxe for arm64 macOS, which Homebrew has.
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install haxe
        mkdir -p "$HOME/haxelib" && haxelib setup "$HOME/haxelib"
    # From git, whose Emscripten toolchain compiles with wasm exceptions, as
    # Rust's standard library for Emscripten unwinds.
    - shell: bash
      run: |
        haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --quiet
        dir="$(haxelib libpath hxcpp)"
        git -C "$dir" checkout -q 615adc73d5ef28f3f74ea47977c39c4f25ce256d
        (cd "$dir/tools/hxcpp" && haxe compile.hxml)
    - shell: bash
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
        "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
    # Ash, which builds a HashLink program for wasm and serves its page.
    - shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) archive=ash-linux-x86_64.tar.gz ;;
          macOS) archive=ash-macos-aarch64.tar.gz ;;
        esac
        mkdir -p "$RUNNER_TEMP/ash"
        (cd "$RUNNER_TEMP/ash" && curl -fsSL "https://github.com/rayzor-blade/ash/releases/download/v0.1.19/$archive" | tar -xz)
        echo "$RUNNER_TEMP/ash" >> "$GITHUB_PATH"
    # The command of the hxn release the crate depends on, since the two must
    # match.
    - shell: bash
      run: |
        tag="$(sed -n 's|^hxn = { git = "https://github.com/hx-n/hxn.git", tag = "\(v[0-9.]*\)" }|\1|p' Cargo.toml)"
        test -n "$tag"
        cargo install --git https://github.com/hx-n/hxn.git --tag "$tag" --locked hxn-cli
        hxn version
    # hxnsl, which writes the check's shaders, with its tool prebuilt.
    - shell: bash
      run: haxelib install hxnsl --always
