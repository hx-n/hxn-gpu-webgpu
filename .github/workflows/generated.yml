name: Haxe sources

# The generated Haxe classes, headers and haxelib.json are committed, so that
# a Haxe program needs no Rust; this fails when they are not what the
# library's source gives.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The release fails when the notices are older than Cargo.toml and Cargo.lock. Refresh them
      # after a build that wrote the HashLink adapter, whose hl_abi the HashLink library links:
      # python3 scripts/third_party_notices.py --extra-manifest target/hxn/gpu_webgpu/hl-wasm-threads/crate/Cargo.toml --extra-package hl_abi
      - run: python3 scripts/third_party_notices.py --check
      - uses: ./.github/actions/setup
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && hxn package cpp --wasm --release --out .
      - run: |
          changed="$(git status --porcelain --untracked-files=all -- binding include haxelib.json extraParams.hxml gpu_webgpu.hxn.json)"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff
            echo "::error::the generated files differ from what the source gives: run hxn package cpp --wasm --out . and commit them"
            exit 1
          fi
