name: Browser

# The check as a web page in headless Chrome, with WebGPU on the runner's GPU on
# macOS and SwiftShader on Linux: hxcpp through Emscripten, served by emrun,
# and a threaded Ash program, served by `ash serve`, whose WebGPU agent runs in
# a Worker of its own.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.runtime }}, Chrome, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runtime: hxcpp
            check: cpp --wasm
            flags: --enable-unsafe-webgpu
          - os: ubuntu-latest
            runtime: hxcpp
            check: cpp --wasm
            flags: --enable-unsafe-webgpu --enable-unsafe-swiftshader --use-webgpu-adapter=swiftshader --enable-features=Vulkan
          - os: macos-latest
            runtime: Ash
            check: hl --wasm --threads
            flags: --enable-unsafe-webgpu
          - os: ubuntu-latest
            runtime: Ash
            check: hl --wasm --threads
            flags: --enable-unsafe-webgpu --enable-unsafe-swiftshader --use-webgpu-adapter=swiftshader --enable-features=Vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fails without WebGPU, rather than passing on the line the check prints
      # without it, and on any error WebGPU reports.
      - env:
          HXN_BROWSER_ARGS: ${{ matrix.flags }}
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          hxn check ${{ matrix.check }} --browser 2>&1 | tee check.txt
          grep -q '^compute: 64 values' check.txt
          grep -q '^render: 4x4 pixels' check.txt
          grep -q '^textured: 4x4 pixels' check.txt
          ! grep -q '^WebGPU .*error' check.txt
